<!doctype html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10 санының құрамы</title><meta property="og:title" content="10 санының құрамы"><meta property="og:description" content="Жетіспейтін санды тап! Интерактивті ойын"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#e7f7ff,#fff0dc);color:#17243a;text-align:center}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:clamp(30px,5vw,52px);margin:12px 0}p{font-size:20px}.top{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;align-items:center;margin:18px}button{cursor:pointer;font-weight:800;border:0;border-radius:16px;padding:12px 22px;font-size:22px;box-shadow:0 4px 0 #0002}#start{background:#30c78a;color:#092d24}#reset{background:#ffd36b}#status{font-size:23px;font-weight:bold;min-height:34px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:20px auto}.card{border:3px solid #fff;background:#fff;border-radius:22px;padding:16px 8px;box-shadow:0 6px 18px #40507020;min-height:146px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.expr{font-family:'Times New Roman',serif;font-size:clamp(30px,4vw,47px);font-weight:bold;white-space:nowrap}.blank{background:#e6ecff;border:3px dashed #6782e7;border-radius:10px;padding:0 10px;color:#4259b8}.options{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.options button{font-family:'Times New Roman',serif;font-size:27px;min-width:48px;padding:6px 10px;background:#eaf4ff;border:2px solid #9bc8ff}.options button:hover{background:#c9e8ff}.card.correct{background:#dcffe7;border-color:#61d69b}.card.correct .blank{background:#b4f1c9;border:2px solid #58bc80;color:#136d38}.card.wrong{animation:shake .28s}.card:nth-child(4n+1){background:#fff5ec}.card:nth-child(4n+2){background:#f0edff}.card:nth-child(4n+3){background:#eafff6}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}#finish{font-size:35px;font-weight:900;color:#10894d;min-height:48px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:12px 4px;min-height:136px}.expr{font-size:30px}.options{gap:4px}.options button{min-width:37px;font-size:23px;padding:5px}main{padding:10px}p{font-size:17px}}</style></head><body><main><h1>🌟 10 санының құрамы 🌟</h1><p>«Бастау» батырмасын бас. Әр мысалдағы жетіспейтін санды таңда!</p><div class="top"><button id="start">▶ Бастау</button><button id="reset">↻ Қайта бастау</button><strong id="timer">⏱ 00:00</strong><strong id="count">0 / 11</strong></div><div id="status" aria-live="polite">Ойын басталған жоқ</div><div id="grid" class="grid"></div><div id="finish" aria-live="polite"></div></main><script>const grid=document.getElementById('grid'),status=document.getElementById('status'),timer=document.getElementById('timer'),count=document.getElementById('count'),finish=document.getElementById('finish');let active=false,done=0,started=0,interval=null;const tasks=Array.from({length:11},(_,i)=>({a:i,b:10-i,missing:i%2===0?'b':'a'}));function format(t){let s=Math.floor(t/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function choices(answer,i){let a=[answer];for(let n=1;a.length<3;n++){let x=(answer+n+i)%11;if(!a.includes(x))a.push(x)}return a.sort((x,y)=>((x*7+i*3)%13)-((y*7+i*3)%13))}function render(){grid.innerHTML='';tasks.forEach((t,i)=>{let answer=t[t.missing],card=document.createElement('div');card.className='card';let exp=document.createElement('div');exp.className='expr';exp.innerHTML=t.missing==='a'?`<span class="blank">?</span> + ${t.b} = 10`:`${t.a} + <span class="blank">?</span> = 10`;card.appendChild(exp);let opts=document.createElement('div');opts.className='options';choices(answer,i).forEach(v=>{let btn=document.createElement('button');btn.textContent=v;btn.disabled=!active;btn.setAttribute('aria-label',v+' саны');btn.onclick=()=>{if(!active||card.classList.contains('correct'))return;if(v===answer){card.classList.add('correct');exp.querySelector('.blank').textContent=v;opts.innerHTML='⭐ Дұрыс!';opts.style.fontWeight='bold';opts.style.color='#13844b';done++;count.textContent=done+' / 11';status.textContent='Жарайсың!';if(done===11){active=false;clearInterval(interval);finish.textContent='🎉 Жарайсың! Барлық жауап дұрыс! 🎉';status.textContent='Ойын аяқталды';}}else{card.classList.remove('wrong');void card.offsetWidth;card.classList.add('wrong');status.textContent='Қайта ойланып көр!';}};opts.appendChild(btn)});card.appendChild(opts);grid.appendChild(card)})}function reset(){clearInterval(interval);active=false;done=0;timer.textContent='⏱ 00:00';count.textContent='0 / 11';status.textContent='Ойын басталған жоқ';finish.textContent='';render()}document.getElementById('start').onclick=()=>{if(active)return;reset();active=true;started=Date.now();status.textContent='Жетіспейтін санды тап!';render();interval=setInterval(()=>{timer.textContent='⏱ '+format(Date.now()-started)},250)};document.getElementById('reset').onclick=reset;reset();</script></body></html>
