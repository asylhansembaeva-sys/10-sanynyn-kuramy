<!doctype html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta property="og:title" content="10 санының құрамы"><title>10 санының құрамы</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e0f2fe,#fdf2f8);font-family:'Times New Roman',serif;color:#172554;text-align:center}main{max-width:760px;margin:18px auto;padding:20px}h1{font-size:clamp(32px,6vw,52px);margin:10px}p{font-size:24px}.panel{background:white;border-radius:26px;padding:22px;box-shadow:0 10px 30px #64748b30}.top{display:inline-flex;align-items:center;justify-content:center;background:#fde68a;border:3px solid #d97706;border-radius:20px;width:128px;height:84px;font-size:60px;font-weight:bold}.branches{height:90px;max-width:360px;width:100%;display:block;margin:0 auto}.bottom{display:flex;justify-content:center;gap:70px}.cell{width:128px;height:85px;border-radius:20px;display:grid;place-items:center;font-size:56px;font-weight:bold}.known{background:#bfdbfe;border:3px solid #3b82f6}.missing{background:#bbf7d0;border:3px dashed #16a34a}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:26px}.choices button,.action{font-family:inherit;font-weight:bold;cursor:pointer;border:0;border-radius:16px;padding:13px 23px;font-size:35px;background:#e9d5ff;color:#581c87;box-shadow:0 4px 0 #c4b5fd}.choices button:active,.action:active{transform:translateY(3px)}.action{background:#2563eb;color:white;font-size:27px;margin:15px}.status{min-height:40px;font-size:29px;font-weight:bold;margin-top:16px}.meta{display:flex;justify-content:space-between;font-size:23px;font-weight:bold;margin:12px auto;max-width:540px}.hidden{display:none}.success{color:#15803d}.error{color:#dc2626}@media(max-width:500px){main{padding:10px}.panel{padding:14px}.bottom{gap:32px}.cell{width:105px;height:76px;font-size:48px}.top{width:115px;height:76px}.choices button{font-size:29px;padding:12px 19px}.branches{height:72px}}</style></head><body><main><h1>10 санының құрамы</h1><div class="meta"><span id="progress">Тапсырма: 0/9</span><span id="timer">Уақыт: 00:00</span></div><div class="panel"><div id="intro"><p>Бос ұяшыққа сәйкес санды басып орналастыр!</p><button class="action" id="start">Бастау</button></div><div id="game" class="hidden"><div class="top">10</div><svg class="branches" viewBox="0 0 360 90" aria-hidden="true"><path d="M180 0 V25 M180 25 L80 85 M180 25 L280 85" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/></svg><div class="bottom"><div class="cell known" id="known"></div><div class="cell missing" id="missing">?</div></div><p>Қай сан жетіспейді?</p><div class="choices" id="choices"></div><div class="status" id="status" aria-live="polite"></div><button id="next" class="action hidden">Келесі тапсырма →</button></div><div id="end" class="hidden"><h2 style="font-size:44px;color:#15803d">Жарайсың! 🎉</h2><p>Барлық тапсырманы орындадың!</p><p id="finalTime"></p><button class="action" onclick="location.reload()">Қайта ойнау</button></div></div></main><script>const tasks=[1,2,3,4,5,6,7,8,9];let index=0,startTime=0,interval=null,solved=false;const el=id=>document.getElementById(id);function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}function tick(){el('timer').textContent='Уақыт: '+fmt(Math.floor((Date.now()-startTime)/1000))}function render(){solved=false;const n=tasks[index],answer=10-n;el('progress').textContent='Тапсырма: '+(index+1)+'/9';el('known').textContent=n;el('missing').textContent='?';el('status').textContent='';el('status').className='status';el('next').classList.add('hidden');const choices=el('choices');choices.innerHTML='';let options=[answer];for(let offset of [1,-1,2]){let candidate=answer+offset;if(candidate>=1&&candidate<=9&&!options.includes(candidate))options.push(candidate)}while(options.length<4){let candidate=1+options.length;if(!options.includes(candidate))options.push(candidate);else break}options.sort((a,b)=>a-b);for(const v of options){const btn=document.createElement('button');btn.textContent=v;btn.addEventListener('click',()=>{if(solved)return;if(v===answer){solved=true;el('missing').textContent=v;el('status').textContent='Жарайсың! 🌟';el('status').classList.add('success');el('next').textContent=index===tasks.length-1?'Нәтижені көру →':'Келесі тапсырма →';el('next').classList.remove('hidden')}else{el('status').textContent='Қайта ойланып көр!';el('status').className='status error'}});choices.appendChild(btn)}}el('start').addEventListener('click',()=>{el('intro').classList.add('hidden');el('game').classList.remove('hidden');startTime=Date.now();interval=setInterval(tick,250);tick();render()});el('next').addEventListener('click',()=>{index++;if(index===tasks.length){clearInterval(interval);tick();el('game').classList.add('hidden');el('end').classList.remove('hidden');el('progress').textContent='9/9 тапсырма';el('finalTime').textContent='Жұмсаған уақытың: '+fmt(Math.floor((Date.now()-startTime)/1000))}else render()});</script></body></html>
